<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brain Tumor Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1><span class="logo-icon">🧠</span> BrainAI</h1>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="active">Login</a>
                <button class="theme-switch" onclick="toggleTheme()" aria-label="Toggle dark mode" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🌓</button>
            </nav>
        </div>
    </header>

    <main style="display: flex; align-items: center; justify-content: center;">
        <div class="glass-card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 class="h2">Welcome Back</h2>
                <p>Secure Login for Medical Professionals</p>
            </div>

            <form onsubmit="event.preventDefault(); login();" aria-label="Login form" autocomplete="on">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="login-email" required autocomplete="username" placeholder="doctor@hospital.org">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="login-password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="cta-button" style="width:100%; margin-top: 1rem;">Sign In</button>
            </form>

            <div style="text-align:center; margin-top: 1.5rem; font-size: 0.9rem;">
                <a href="#" style="color: var(--primary-color);">Forgot Password?</a>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2025 BrainAI Medical Systems. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
