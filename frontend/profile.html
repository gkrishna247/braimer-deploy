<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Brain Tumor Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1><span class="logo-icon">🧠</span> BrainAI</h1>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="profile.html" class="active">Profile</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="glass-card" style="text-align: center;">
            <div style="width: 100px; height: 100px; background-color: var(--secondary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1.5rem auto;">
                👤
            </div>
            <h2>Dr. Alex Smith</h2>
            <p>Neurologist | ID: 89304</p>
            <p>alex.smith@hospital.org</p>
        </div>

        <div class="glass-card">
            <h3>Account Settings</h3>
            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" value="Alex Smith" disabled>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" value="alex.smith@hospital.org" disabled>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <button type="button" disabled>Change Password</button>
                </div>
            </form>
        </div>

        <div class="glass-card">
            <h3>System Preferences</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #eee;">
                <span>Email Notifications</span>
                <span style="color: var(--secondary-color); font-weight: 500;">Enabled</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0;">
                <span>Data Sharing</span>
                <span style="color: var(--text-color-muted);">Disabled</span>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2025 BrainAI Medical Systems. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
